endpoint:                              # where the agent binds (the eval reads this too)
  url: http://localhost
  port: __PORT__

# agent_card: ./agent.json             # optional; path to the agent card (default: ./agent.json)

model:
  provider: __MODEL_PROVIDER__
  name: __MODEL__
  # base_url: http://localhost:11434   # optional (e.g. for ollama)

checkpoints: false

telemetry:
  # service_name: my-agent             # optional (defaults to the agent name)
  # project_name: my-agent             # optional; Phoenix project for the traces (default: "default")
  output: []                           # telemetry is ON when output has >=1 entry; spans fan out to every entry
    # Replace [] above with one entry per destination, e.g.:
    # - type: remote                   # remote | local | console
    #   endpoint: http://localhost:6006  # OTLP collector (e.g. Phoenix)
    # - type: local
    #   file_path: spans.jsonl         # JSON Lines, one span per line

