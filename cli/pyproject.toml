[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bat-cli"
version = "2026.06"
authors = [
  { name="Enrico SBUTTONI", email="enrico.sbuttoni@bubbleran.com" },
]
description = "CLI tool to interact with BAT agents"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "typer>=0.12.3",
  # A pre-release must be named to be resolved (PEP 440); the eval reads
  # spans only this ADK emits. Keep equal to BAT_ADK_VERSION in create/agent.py.
  "bat-adk[all]>=2026.9.29a0",
  "a2a-sdk>=1.0.0",
  "python-dotenv>=1.0.1",
  "matplotlib>=3.8",
]

[project.scripts]
bat = "cli:app"

[project.urls]
"Homepage" = "https://bubbleran.com/"
"Repository" = "https://github.com/bubbleran/bat"

[dependency-groups]
dev = [
  "pytest>=8.0",
]
packaging = [
  "pyinstaller>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "image", "project"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
create = [
  "templates/agent/*",
  "templates/agent/.*",
  "templates/agent/src/*",
  "templates/agent/tests/*",
  "templates/blueprint/*",
  "templates/blueprint/.*",
  "templates/blueprint/agent/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 80
extend-exclude = ["src/create/templates"]  # agent scaffold templates, not valid Python

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (standard spacing, formatting)
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (catches unused imports, undefined variables)
    "I",   # isort (automatically sorts your imports alphabetically)
    "B",   # flake8-bugbear (catches tricky hidden Python bugs)
    "SIM", # flake8-simplify (helps you write simpler, shorter code)
]
ignore = [
    "B008", # function call in default argument (this is the Typer/FastAPI pattern)
]
