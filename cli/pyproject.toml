[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bat-cli"
version = "0.1.1"
description = "CLI tool to interact with BAT agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.3",
    "bat-adk>=2026.06rc1",
    "bat-adk[openai]",
    "a2a-sdk>=1.0.0",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.scripts]
bat = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "image_defaults"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
create = [
    "templates/agent/*",
    "templates/agent/.*",
    "templates/agent/src/*",
    "templates/agent/src/llm_clients/*",
    "templates/agent/tests/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
