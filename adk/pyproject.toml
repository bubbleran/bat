[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bat-adk"
version = "2026.11.dev0"
authors = [
  { name="Andrea LEONE", email="andrea.leone@bubbleran.com" },
  { name="Enrico SBUTTONI", email="enrico.sbuttoni@bubbleran.com" },
]
description = "Software Development Kit for building AI Agents in BubbleRAN MX-PDK and MX-AI"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "a2a-sdk[http-server]>=1.2.3",
  "httpx>=0.28.1",
  "langchain>=1.4",
  "langchain-mcp-adapters>=0.3.2",
  "langgraph>=1.2.16",
  "mcp[cli]>=1.17.0",
  "opentelemetry-api>=1.27.0",
  "pydantic>=2.10.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0.1",
  "uvicorn>=0.37.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
deepseek = ["langchain-deepseek"]
nvidia = ["langchain-nvidia-ai-endpoints"]
ollama = ["langchain-ollama"]
openai = ["langchain-openai>=1.6.6"]
postgres = [
  "langgraph-checkpoint-postgres>=3.2.0",
  "psycopg[binary]",
  "sqlalchemy[asyncio]>=2.0",
]
telemetry = [
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "openinference-instrumentation-langchain>=0.1.73",
  "openinference-instrumentation>=0.1.53",
]
all = ["bat-adk[anthropic,deepseek,nvidia,ollama,openai,postgres,telemetry]"]

[dependency-groups]
dev = [
  "bat-adk[postgres,telemetry]",
  "build",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "twine",
]

[project.urls]
"Homepage" = "https://bubbleran.com/"
"Repository" = "https://github.com/bubbleran/bat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 80
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The A2A SDK reads its instrumentation switch at import: set it first.
"src/bat/__init__.py" = ["E402"]

[tool.ruff.format]
indent-style = "space"
