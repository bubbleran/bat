[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bat-adk"
version = "2026.6.26a0"
authors = [
  { name="Andrea LEONE", email="andrea.leone@bubbleran.com" },
  { name="Enrico SBUTTONI", email="enrico.sbuttoni@bubbleran.com" },
]
description = "Software Development Kit for building AI Agents in BubbleRAN MX-PDK and MX-AI"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "a2a-sdk>=1.0.0",
  "a2a-sdk[http-server]",
  "httpx>=0.28.1",
  "langchain>=0.3.24",
  "langchain-mcp-adapters>=0.2.0",
  "langgraph>=1.0.0",
  "mcp[cli]>=1.17.0",
  "pydantic>=2.10.6",
  "pyyaml>=6.0.1",
  "uvicorn>=0.37.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
deepseek = ["langchain-deepseek"]
nvidia = ["langchain-nvidia-ai-endpoints"]
ollama = ["langchain-ollama"]
openai = ["langchain-openai"]

telemetry = [
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "openinference-instrumentation-langchain>=0.1.29",
]

all = [
  "bat-adk[anthropic]",
  "bat-adk[deepseek]",
  "bat-adk[nvidia]",
  "bat-adk[ollama]",
  "bat-adk[openai]",
  "bat-adk[telemetry]",
]

[dependency-groups]
dev = [
  "build",
  "twine",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
]

[project.urls]
"Homepage" = "https://bubbleran.com/"
"Repository" = "https://github.com/bubbleran/bat"

[tool.ruff]
target-version = "py312"
line-length = 80

# Files or directories to ignore entirely
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (standard spacing, formatting)
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (catches unused imports, undefined variables)
    "I",   # isort (automatically sorts your imports alphabetically)
    "B",   # flake8-bugbear (catches tricky hidden Python bugs)
    "SIM", # flake8-simplify (helps you write simpler, shorter code)
]

# Custom settings for specific files
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]     # Allow 'assert' statements in tests without warning

[tool.ruff.format]
indent-style = "space"
